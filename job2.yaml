apiVersion: batch/v1
kind: Job
metadata:
  name: secondtestjob
spec:
  parallelism: 5                           # Runs for pods in parallel
  activeDeadlineSeconds: 10  # Timesout after 30 sec
  template:
    metadata:
      name: secondtestjob
    spec:
      containers:
       - name: counter
         image: nginx
         command: ["bin/bash", "-c", "echo Technical-Guftgu; sleep 20"]
      restartPolicy: Never
