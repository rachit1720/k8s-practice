apiVersion: v1
kind: Pod

metadata:
  name: myvolconfig

spec:
  containers:
    - name: c1
      image: nginx
      command: ["/bin/bash", "-c", "while true; do echo Technical-Guftgu; sleep 5; done"]

      volumeMounts:
        - name: testconfigmap
          mountPath: "/tmp/config"

  volumes:
    - name: testconfigmap
      configMap:
        name: ram
        items:
          - key: sample.conf
            path: sample.conf
