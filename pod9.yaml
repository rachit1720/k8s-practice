apiVersion: apps/v1
kind: Deployment
metadata:
  name:  rachitdeployment
spec:
  selector:
    matchLabels:
      app: MYAPP
  replicas: 1
  template:
    metadata:
      name: trypod1
      labels:
        app:  MYAPP
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  c09
        image:  httpd
        ports:
        - containerPort: 80
